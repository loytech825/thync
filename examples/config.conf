# Autogenerated default config

[default]
path = ${output_dir}/${section_name}
format = ${color_name} #${color_value}
format_id = ${color_name} #${color_value}
comment = #

post_cmd = "bash /home/matic-bratina/code/thync/reload.sh"


theme_dir = "${config_dir}/thync/themes"
# set default grayscale
defaults = "f{defaults.conf}"

[vscode]
path = "~/.vscode/extensions/catppuccin.catppuccin-vsc-3.19.0/themes/test.json"
comment = ""
mode = "modify-ignore"
config_format = "f{vscode-format.json}"

[hyprland]
path = ${output_dir}/hypr/hyprland-colors.lua
comment = "--"

defaults = "
    active_border_1 = ${color255}
    active_border_2 = ${color250}
    inactive_border_clr = ${color232}
"

#we need rgba support i guess
format = "${color_name} = \"rgb(${color_value})\""

[waybar]
defaults = "
  background2 = ${bg4}
  background = ${bg2}
"
comment = ""
path = ${output_dir}/waybar/colors.css
format = "@define-color ${color_name} #${color_value};"

[kitty]
path = ${output_dir}/kitty/colors.conf
format_id = "color${color_id} #${color_value}"

[nvim]
mode = "modify-ignore"
comment = "\""
path = ${output_dir}/nvim/colors/colors.vim
config_format = "f{vim-format.vim}"

[mako]
comment = ""
mode = "modify-ignore"
path = ${output_dir}/mako/config.noext
config_format = "f{mako-format.conf}"

[hyprpaper]
path = "~/wallpapers/active_wallpaper.png"

[hypr]
path = "~/.config/hypr/colors.conf"
format = "$${color_name} = rgb(${color_value})" 
